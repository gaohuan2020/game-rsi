[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "game-rsi"
version = "0.1.0"
description = "PlayJev games with a measured RSI-Jev self-improvement loop"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pillow>=11", "playwright>=1.56,<2", "psutil>=6"]

[project.optional-dependencies]
train = ["torch>=2.13", "torchvision>=0.28", "transformers>=5.17,<5.18", "accelerate>=1.15", "safetensors", "numpy", "einops"]
test = ["pytest>=8", "httpx"]

[project.scripts]
game-rsi = "game_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_rsi = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
